<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framed portrait hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap">
<style>
:root{--bg:#150f14;--bg2:#241820;--fg:#f4e9e4;--muted:#b9a6a6;--rose:#d9a99a;--gold:#c9a27a;--line:rgba(217,169,154,.55);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(60% 70% at 72% 45%,#3a2430 0%,var(--bg2) 38%,var(--bg) 78%);color:var(--fg);font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300}
.wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,6vw,96px);max-width:1200px;margin:0 auto;padding:clamp(32px,6vw,80px) clamp(24px,5vw,64px)}
.copy h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(2.8rem,6.4vw,5.6rem);line-height:.98;letter-spacing:-.01em;margin:0}
.copy h1 em{font-style:italic;color:var(--rose)}
.copy p{max-width:38ch;color:var(--muted);line-height:1.7;margin:1.6rem 0 2rem;font-size:1.02rem}
.copy a{display:inline-block;color:var(--fg);text-decoration:none;font-size:.95rem;padding:.85rem 1.8rem;border:1px solid var(--line);border-radius:999px;transition:background .3s,border-color .3s}
.copy a:hover{background:rgba(217,169,154,.14);border-color:var(--rose)}
.copy a:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* ornate gold frame */
.stage{display:flex;justify-content:center}
.ornate{width:min(100%,460px);height:auto;display:block;filter:drop-shadow(0 24px 36px rgba(0,0,0,.5))}
.ornate .ph{transition:transform 1.2s cubic-bezier(.2,.7,.2,1);transform-box:fill-box;transform-origin:center}
.ornate:hover .ph{transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){.ornate .ph{transition:none}}
@media (max-width:820px){.wrap{grid-template-columns:1fr;text-align:center}.copy p{margin-left:auto;margin-right:auto}.stage{order:-1}}
@media (prefers-reduced-motion:reduce){.photo img{transition:none}}
</style>
</head>
<body>

<main class="wrap">
  <section class="copy">
    <h1>Soft light,<br><em>quiet</em> confidence.</h1>
    <p>A calm hero with a framed portrait. Replace this line with your own description and button text.</p>
    <a href="#book">Book a consultation</a>
  </section>
