<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlexCarousel demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#0c0b12;--fg:#f1eefc;--muted:#9d97b8;--line:rgba(255,255,255,.16);--accent:#a28bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4fb;--fg:#1c1830;--muted:#6a6485;--line:rgba(0,0,0,.18);--accent:#5b43d6;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0c0b12;--fg:#f1eefc;--muted:#9d97b8;--line:rgba(255,255,255,.16);--accent:#a28bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 56px}
header h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:600;letter-spacing:-.03em;margin:0 0 .4rem}
header p{color:var(--muted);margin:0 0 1.6rem;max-width:56ch;line-height:1.6}
.stage{height:clamp(440px,68vh,640px);position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin-top:20px;font-size:.9rem;color:var(--muted)}
.group{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.group button{background:none;border:0;color:var(--muted);font:inherit;padding:7px 16px;border-radius:999px;cursor:pointer}
.group button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;margin-left:6px}
label.chk{display:inline-flex;gap:6px;align-items:center}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;padding:7px 16px;border-radius:999px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:.85rem;margin-top:18px}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}

.flex-carousel{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:contain;outline:none}.flex-carousel[data-hover=open]{cursor:zoom-in}.flex-carousel[data-hover=close]{cursor:zoom-out}.flex-carousel[data-dragging]{cursor:grabbing}.flex-carousel:focus-visible{box-shadow:inset 0 0 0 2px #80808c8c}.flex-carousel__caption{position:absolute;left:0;right:0;top:calc(50% + var(--flex-carousel-half) * var(--flex-carousel-lift, 1) + 22px);display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px;pointer-events:none;text-align:center;animation:flex-carousel-reveal .9s ease both}.flex-carousel__title{display:flex;flex-direction:column;align-items:center;max-width:100%;font-size:15px;font-weight:500;line-height:1.35;animation:flex-carousel-title .52s cubic-bezier(.22,1,.36,1)}.flex-carousel__subtitle{font-weight:400;opacity:.6}.flex-carousel__count{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1;font-variant-numeric:tabular-nums;opacity:.5;transition:opacity .4s ease}.flex-carousel__count[data-hidden]{opacity:0}.flex-carousel__digits{display:inline-flex}.flex-carousel__digit{display:inline-block;height:1em;overflow:hidden}.flex-carousel__reel{display:flex;flex-direction:column;transition:transform .6s cubic-bezier(.22,1,.36,1)}.flex-carousel__reel span{height:1em}.flex-carousel__slash{opacity:.6}.flex-carousel__live{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes flex-carousel-title{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes flex-carousel-reveal{0%{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.flex-carousel__caption,.flex-carousel__title{animation:none}.flex-carousel__reel{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
