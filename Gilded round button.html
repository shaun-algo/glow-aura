<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gilded round button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&display=swap">
<style>
:root{--bg:#150f14;--bg2:#241820;--fg:#f4e9e4;--muted:#b9a6a6;--rose:#d9a99a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(70% 60% at 50% 30%,#3a2430 0%,var(--bg2) 40%,var(--bg) 85%);color:var(--fg);font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300}
main{max-width:980px;margin:0 auto;padding:clamp(32px,6vw,72px) 24px 80px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(2rem,5vw,3.4rem);margin:0 0 .5rem;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:52ch;line-height:1.7;margin:0 0 3rem}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:1.3rem;color:var(--rose);margin:2.6rem 0 1.2rem}
.row{display:flex;flex-wrap:wrap;gap:36px;align-items:center}
.cap{display:block;text-align:center;font-size:.78rem;color:var(--muted);margin-top:10px}

.btn{--s:150px;--face:url(#faceDark);--ink:#f6e3c3;position:relative;width:var(--s);height:var(--s);padding:0;border:0;background:none;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;-webkit-tap-highlight-color:transparent}
.btn.lg{--s:190px}.btn.md{--s:130px}.btn.sm{--s:88px}
.btn.light{--face:url(#faceLight);--ink:#4a2b1f}
.btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));transition:filter .35s,transform .25s}
.btn .lbl{position:relative;z-index:1;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:calc(var(--s)*.15);line-height:1.05;text-align:center;max-width:62%;text-shadow:0 1px 0 rgba(0,0,0,.35);transition:transform .25s}
.btn .ico{position:relative;z-index:1;width:calc(var(--s)*.3);height:calc(var(--s)*.3);fill:var(--ink)}
.btn:hover svg{filter:drop-shadow(0 12px 18px rgba(0,0,0,.55)) drop-shadow(0 0 20px rgba(217,169,154,.38)) brightness(1.1) saturate(1.1);transform:translateY(-2px)}
.btn:hover .lbl{transform:translateY(-2px)}
.btn:active svg{transform:scale(.965);filter:drop-shadow(0 4px 8px rgba(0,0,0,.55)) brightness(.9)}
.btn:active .lbl{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--rose);outline-offset:6px}
.btn:disabled{cursor:not-allowed;opacity:.45;filter:grayscale(.7)}
.btn:disabled svg{transform:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
@media (prefers-reduced-motion:reduce){.btn svg,.btn .lbl{transition:none}.btn:hover svg{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="220"><stop offset="0" stop-color="#f7e2b4"/><stop offset=".35" stop-color="#d9b072"/><stop offset=".6" stop-color="#b98a4c"/><stop offset="1" stop-color="#8a5f33"/></linearGradient>
<radialGradient id="faceDark" cx=".4" cy=".32" r=".85"><stop offset="0" stop-color="#5a3646"/><stop offset=".6" stop-color="#2d1b25"/><stop offset="1" stop-color="#1a1017"/></radialGradient>
<radialGradient id="faceLight" cx=".4" cy=".32" r=".85"><stop offset="0" stop-color="#fff3e2"/><stop offset=".65" stop-color="#ecd0bd"/><stop offset="1" stop-color="#cfa793"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="faceClip"><circle cx="110" cy="110" r="76"/></clipPath>
<filter id="soft" filterUnits="userSpaceOnUse" x="-10" y="-10" width="240" height="240"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="relief" filterUnits="userSpaceOnUse" x="-10" y="-10" width="240" height="240" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
<feDiffuseLighting in="blur" surfaceScale="4" diffuseConstant="1.3" lighting-color="#fff" result="diff"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
<feComposite in="diff" in2="SourceAlpha" operator="in" result="diffIn"/>
<feBlend in="SourceGraphic" in2="diffIn" mode="multiply" result="lit"/>
<feSpecularLighting in="blur" surfaceScale="4" specularConstant="1.2" specularExponent="26" lighting-color="#fff6dc" result="spec"><feDistantLight azimuth="225" elevation="45"/></feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
<feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" result="noise"/>
<feColorMatrix in="noise" type="matrix" values="0 0 0 0 .22  0 0 0 0 .13  0 0 0 0 .05  0 0 0 .5 -.08" result="grain"/>
<feComposite in="grain" in2="SourceAlpha" operator="in" result="grainIn"/>
<feMerge><feMergeNode in="lit"/><feMergeNode in="specIn"/><feMergeNode in="grainIn"/></feMerge>
</filter>

<g id="leaf"><path d="M0,0 C3,-9 15,-13 28,-8 C23,2 11,6 0,0Z" fill="url(#gold)" stroke="#6b4423" stroke-width=".9"/><path d="M2,-1 C10,-4 18,-6 25,-7" fill="none" stroke="#6b4423" stroke-width="1" opacity=".7"/></g>
<g id="flower" stroke="#6b4423" stroke-width=".9" fill="url(#gold)">
<ellipse cx="0" cy="-10" rx="4.6" ry="9"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(45)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(90)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(135)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(180)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(225)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(270)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(315)"/>
<g transform="rotate(22) scale(.62)"><ellipse cx="0" cy="-10" rx="4.6" ry="9"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(72)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(216)"/><ellipse cx="0" cy="-10" rx="4.6" ry="9" transform="rotate(288)"/></g>
<circle r="3.2"/>
</g>
<g id="mid" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
<path fill="url(#gold)" stroke="#6b4423" stroke-width=".9" d="M0,-16 C-8,-7 -8,5 0,13 C8,5 8,-7 0,-16Z"/>
<path d="M0,10 C-10,15 -22,9 -26,-3 C-28,-10 -20,-12 -18,-6"/>
<path d="M0,10 C10,15 22,9 26,-3 C28,-10 20,-12 18,-6"/>
</g>

<g id="face">
<circle cx="110" cy="110" r="76" style="fill:var(--face)"/>
<g clip-path="url(#faceClip)"><circle cx="110" cy="110" r="76" fill="none" stroke="#000" stroke-width="24" opacity=".55" filter="url(#soft)"/></g>
<circle cx="110" cy="110" r="76" fill="url(#sheen)"/>
</g>

<g id="ring" filter="url(#relief)">
<circle cx="110" cy="110" r="80" fill="none" stroke="url(#gold)" stroke-width="13"/>
<circle cx="110" cy="110" r="90.5" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" pathLength="48" stroke-dasharray="0 1"/>
<circle cx="110" cy="110" r="96.5" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
<use href="#mid" transform="translate(110 110) rotate(0) translate(0 -100) scale(.62)"/>
<use href="#mid" transform="translate(110 110) rotate(90) translate(0 -100) scale(.62)"/>
<use href="#mid" transform="translate(110 110) rotate(180) translate(0 -100) scale(.62)"/>
<use href="#mid" transform="translate(110 110) rotate(270) translate(0 -100) scale(.62)"/>
<use href="#flower" transform="translate(110 110) rotate(45) translate(0 -98) scale(.62)"/>
<use href="#flower" transform="translate(110 110) rotate(135) translate(0 -98) scale(.62)"/>
<use href="#flower" transform="translate(110 110) rotate(225) translate(0 -98) scale(.62)"/>
<use href="#flower" transform="translate(110 110) rotate(315) translate(0 -98) scale(.62)"/>
<use href="#leaf" transform="translate(110 110) rotate(22.5) translate(0 -97) scale(.5)"/>
<use href="#leaf" transform="translate(110 110) rotate(67.5) translate(0 -97) scale(-.5 .5)"/>
<use href="#leaf" transform="translate(110 110) rotate(112.5) translate(0 -97) scale(.5)"/>
<use href="#leaf" transform="translate(110 110) rotate(157.5) translate(0 -97) scale(-.5 .5)"/>
<use href="#leaf" transform="translate(110 110) rotate(202.5) translate(0 -97) scale(.5)"/>
<use href="#leaf" transform="translate(110 110) rotate(247.5) translate(0 -97) scale(-.5 .5)"/>
<use href="#leaf" transform="translate(110 110) rotate(292.5) translate(0 -97) scale(.5)"/>
<use href="#leaf" transform="translate(110 110) rotate(337.5) translate(0 -97) scale(-.5 .5)"/>
</g>
</defs>
</svg>

<main>
  <h1>Gilded round button</h1>
  <p class="lead">A small version of the carved gold frame: beaded ring, scrolls, leaves and flowers around a dark or light center. Hover and press them to see the states.</p>

  <h2>Dark center</h2>
  <div class="row">
    <div><button class="btn lg" type="button"><svg viewBox="0 0 220 220" aria-hidden="true"><use href="#face"/><use href="#ring"/></svg><span class="lbl">Book<br>now</span></button><span class="cap">Large</span></div>
    <div><button class="btn md" type="button"><svg viewBox="0 0 220 220" aria-hidden="true"><use href="#face"/><use href="#ring"/></svg><span class="lbl">Shop</span></button><span class="cap">Medium</span></div>
    <div><button class="btn sm" type="button" aria-label="Save to favorites"><svg viewBox="0 0 220 220" aria-hidden="true"><use href="#face"/><use href="#ring"/></svg><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position:relative;inset:auto;filter:none;overflow:visible"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.7 1.1 5.6 3 1.9-1.9 3.6-3 5.6-3 3.4 0 5.5 3.4 4 6.8C19.5 16.4 12 21 12 21z"/></svg></button><span class="cap">Small, icon</span></div>
  </div>

  <h2>Light center</h2>
  <div class="row">
    <div><button class="btn light lg" type="button"><svg viewBox="0 0 220 220" aria-hidden="true"><use href="#face"/><use href="#ring"/></svg><span class="lbl">Explore</span></button><span class="cap">Large</span></div>
    <div><button class="btn light md" type="button"><svg viewBox="0 0 220 220" aria-hidden="true"><use href="#face"/><use href="#ring"/></svg><span class="lbl">Details</span></button><span class="cap">Medium</span></div>
    <div><button class="btn md" type="button" disabled><svg viewBox="0 0 220 220" aria-hidden="true"><use href="#face"/><use href="#ring"/></svg><span class="lbl">Sold out</span></button><span class="cap">Disabled</span></div>
  </div>
</main>
</body>
</html>
